<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow_adeegify" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 300) rotate(90) scale(400 700)">
      <stop stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="0.6" stop-color="#06b6d4" stop-opacity="0.04" />
      <stop offset="1" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e0e11" />
      <stop offset="0.5" stop-color="#121217" />
      <stop offset="1" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="50" y1="40" x2="1150" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1c24" stop-opacity="0.9" />
      <stop offset="1" stop-color="#111116" stop-opacity="0.95" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#gridPattern)" />
  <circle cx="600" cy="300" r="420" fill="url(#glow_adeegify)" />

  <!-- Outer Window Frame -->
  <rect x="35" y="35" width="1130" height="605" rx="18" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Window Header / Browser Bar -->
  <rect x="35" y="35" width="1130" height="52" rx="18" fill="#141419" />
  <rect x="35" y="70" width="1130" height="17" fill="#141419" />
  <line x1="35" y1="87" x2="1165" y2="87" stroke="#27272a" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="65" cy="61" r="6" fill="#ef4444" />
  <circle cx="85" cy="61" r="6" fill="#f59e0b" />
  <circle cx="105" cy="61" r="6" fill="#10b981" />

  <!-- URL Pill -->
