  <text x="150" y="65" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="500">🔒  https://adeegify.vercel.app</text>

  <!-- Author Signature Pill -->
  <g transform="translate(930, 48)">
    <rect width="205" height="26" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1" />
