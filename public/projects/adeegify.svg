  </g>

  <!-- Content Section -->
  <!-- Project Logo / Emoji Block -->
  <rect x="70" y="140" width="84" height="84" rx="20" fill="#1e1e26" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8" />
  <text x="112" y="193" font-size="40" text-anchor="middle">🏛️</text>

  <!-- Category Pill -->
  <rect x="175" y="145" width="280" height="30" rx="8" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" />
  <text x="190" y="165" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PROJECT SHOWCASE</text>

  <!-- Main Title -->
  <text x="175" y="215" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Adeegify — Public Services</text>

  <!-- Subtitle / Description -->
  <text x="70" y="285" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400">Unified Digital Service Delivery & Civic Platform for Citizens</text>

  <!-- Visual UI Mockup Box -->
  <rect x="70" y="325" width="1060" height="175" rx="14" fill="#0c0c10" stroke="#27272a" stroke-width="1" />

