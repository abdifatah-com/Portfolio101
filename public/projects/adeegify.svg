  <text x="805" y="415" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Production Verified</text>
  <circle cx="810" cy="445" r="4" fill="#22c55e" />
  <text x="822" y="449" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Active &amp; Open Source</text>

  <!-- Tags Row -->
  
